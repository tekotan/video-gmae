# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm
  - _self_

hydra:
  callbacks:
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  launcher:
    gpus_per_node: ${trainer.devices}
    tasks_per_node: ${trainer.devices}
    nodes: ${trainer.num_nodes}
    cpus_per_task: 10
    partition: scavenge
    timeout_min: 4320
    constraint: 'volta32gb'
    name: ${task_name}
    # partition: w3,learnaccel,devaccel
    # mem_gb: 450
    # timeout_min: ${datamodule.timeout_min}
    # constraint: volta32gb
    exclude: 'learnfair5296,learnfair5279,learnfair5281,learnfair5290,learnfair5292,learnfair5237,learnfair5264,learnfair2377,learnfair2425,learnfair2121,learnfair2290'
