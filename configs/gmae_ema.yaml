# @package _global_

defaults:
    - launcher: default.yaml
    - trainer: default.yaml
    # - override hydra/job_logging: none #colorlog
    # - override hydra/hydra_logging: none #colorlog

callbacks:
    model_checkpoint:
        _target_: lightning.pytorch.callbacks.ModelCheckpoint
        # _target_: lart.utils.ema_checkpoint.EMACheckpoint    
        dirpath: ${paths.output_dir}/checkpoints
        filename: "epoch_{epoch:03d}"
        monitor: "val/loss/loss"
        mode: "min"
        save_last: True
        auto_insert_metric_name: False
        verbose: False # verbosity mode
        save_top_k: 1 # save k best models (determined by above metric)
        save_weights_only: False # if True, then only the model’s weights will be saved
        every_n_train_steps: null # number of training steps between checkpoints
        train_time_interval: null # checkpoints are monitored at the specified time interval
        every_n_epochs: 1 # number of epochs between checkpoints
        save_on_train_epoch_end: True # whether to run checkpointing at the end of the training epoch or the end of validation

    model_summary:
        _target_: lightning.pytorch.callbacks.RichModelSummary
        max_depth: 1

    rich_progress_bar:
        _target_: lightning.pytorch.callbacks.RichProgressBar
        refresh_rate: 0

    learning_rate_monitor:
        _target_: lightning.pytorch.callbacks.LearningRateMonitor

    timer:
        _target_: lightning.pytorch.callbacks.Timer   

    ema:
        _target_: chewbacca.utils.ema.EMA
        decay: 0.999
        cpu_offload: False
        validate_original_weights: False
        every_n_steps: 1  

logger:
    tensorboard:
        _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
        save_dir: "${paths.output_dir}/tensorboard/"
        version: 0

paths: 
    root_dir: ${oc.env:PROJECT_ROOT}
    data_dir: ${paths.root_dir}/data/
    log_dir: ${paths.root_dir}/logs/
    output_dir: ${hydra:runtime.output_dir}
    work_dir: ${hydra:runtime.cwd}

extras:
    print_config: True

hydra:
    run:
        dir: ${paths.log_dir}/${task_name} #/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
    sweep:
        dir: ${paths.log_dir}/${task_name} #/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
        subdir: ${hydra.job.num}

hydra_logging: colorlog
job_logging: colorlog



# task name, determines output directory path
task_name: "1000"
tags: ["dev"]
# slrum_job_id: ${oc.env:SLURM_ARRAY_TASK_ID}

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: null


datamodule:
    _target_: chewbacca.datamodules.mae_datamodule.MAEDataModule
    cfg: ${configs}
    train: ${train}

model:
    _target_: chewbacca.models.vgpt.VGPT_LitModule
    cfg: ${configs}

configs:


    task: "pretrain" # pretrain, finetune
    model_name: "vgpt_base"
    tokenizer_name: "dvae-8k"
    tokenizer_path: null
    input_size: 256
    patch_size: 8



    in1k_pix_ft_num_classes: 1000
    num_classes: 1000
    
    return_full_image: False
    color_jitter: null
    aa: rand-m9-mstd0.5-inc1
    reprob: 0.25
    mixup: 0.80
    cutmix: 1.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.5
    mixup_mode: batch
    remode: pixel
    recount: 1
    resplit: False
    global_pool: False
    loss: "ce"

    data_dir: ${paths.data_dir}
    storage_folder: "${paths.log_dir}/${task_name}/${hydra:sweep.subdir}"
    sampling_rate: 1 # in Hz
    train_batch_size: 8
    train_num_workers: 8
    test_batch_size: 8
    test_num_workers: 8
    pin_memory: True
    finetune: False
    solver: "AdamW"
    lr: 0.001
    momentum: 0.9
    decay_gamma: 0.1
    layer_decay: null
    ZERO_WD_1D_PARAM: True
    warmup_epochs: 5
    warmup_steps: 2000
    weight_decay: 0.05
    scheduler: "cosine"
    debug: False
    load_strict: True
    dataset_loader: "base"
    vit_model: mae_vit_base_patch16
    weights_path: null
    dataset: "all"
    log_frequency: 10
    apply_linear_scaling: True
    use_vqvae: False
    use_vqvae_vocab_size: 1024

    dataset_type: "all"
    train_datasets: kinetics_train,ava_train,all_imgs
    test_datasets: ava_val
    use_torch_compile: False

    action_space: ava
    predict_pose: False
    predict_pose_weight: 1.0
    in_feat: 1000
    ft_layers: null
    use_det: False

    # gpt configs
    seq_length: 16
    sample_rate: 4
    num_videos_render : 0
    depth: 12
    heads: 8
    dim: 512
    comma_final_eval: False
    k400_final_eval: False
    k400_ft_coff_1: 1
    in1k_ft_coff_1: 1
    in1k_pix_ft_coff_1: 1
    
    use_xformer: False
    promt: False
    vqgan_type: "vqgan"


    layer_dropout: 0.0
    attn_dropout: 0.0
    ff_dropout: 0.0
    gpt_mask_prob: 0.0
    emb_dropout: 0.0
    ff_mult: 4
    use_alibi: False
    upsample_generation: False
    
    finetune_layer: null
    feature_layer: null
    vit_backbone: False
    vit_backbone_input_type: "tokens"
    llama_backbone: False
    compute_acc: True

    task_2: finetune

    vocab_size_gpt: 16384

    mean_token: False
    lr_interval: "epoch"
    use_cache: False
    top_p: 0.9
    top_k: 40
    temperature: 1.0
    overfit: False
    
    video_source: "ego4d"
    use_prob: True
    
    save_attn: False
    generate_seq_len: 16
    generate_input_len: 4

    mask_ratio: 0.90
    num_points: 1000
    mask_ratio_mae: 0.5
    mix_token_ratio: 0.5
    mask_type: "constant"
    weighted_pool: False

    contrastive_training: False
    training_type: "vgpt"
    num_same_images: 2
    add_in22k: False
    num_same_images_infer: 0
    num_random_tokens: 1024
    eval_crops: 15
    byol_layer: -1
    byol_weight: 1
    num_key_value_heads: 16

    vocab_size: 256
    scale_factor: 1.0
    scale_vocab: 1.0

    deltas_reg_weight: 0.0
    random_frames: False
    mean_deltas: True
    rgb_deltas: False
    rgb_deltas_scale: 1

    upsample_gaussians: []
    spawning: False
    frame_zero: False

    drop_path: 0.0
    preload: 0
    chunk_size: 1024

    inference:
        testing: False
        depth: False
        correspondences: False
    
    finetune_params:
        reuse_decoder: False
        num_fourier_features: 0
