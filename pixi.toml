[project]
name = "video-gmae"
version = "0.1.0"
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[tasks]
install = "pip install -e ."

[dependencies]
python = "3.10.*"
pytorch = "2.2.0"
torchvision = "0.17.0"
torchaudio = "2.2.0"
pytorch-cuda = "12.1"
numpy = "1.26.*"
scikit-image = "0.25.*"
opencv = "4.10.*"
ffmpeg = "*"
hydra-core = "1.3.*"
hydra-submitit-launcher = "1.2.*"
lightning = "2.4.*"
timm = "1.0.*"
einops = "0.8.*"
transformers = "4.44.*"
torchmetrics = "1.4.*"
tqdm = "4.66.*"
rich = "13.8.*"
absl-py = "2.1.*"
joblib = "1.4.*"
moviepy = "1.0.*"

[pypi-dependencies]
xformers = "0.0.24"
lpips = "0.1.4"
pyrootutils = "1.0.4"
webdataset = "0.2.100"
ffmpeg-python = "0.2.0"
