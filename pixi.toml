[project]
name = "video-gmae"
version = "0.1.0"
description = "Tracking by Predicting 3-D Gaussians Over Time"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.1"

[dependencies]
python = "3.10.*"
pip = "*"
pytorch = "2.1.0.*"
torchvision = "0.16.0.*"
pytorch-cuda = "12.1.*"
torchaudio = "2.1.0.*"
numpy = "1.26.*"
ffmpeg = "*"
ninja = "1.11.*"
scikit-image = "0.25.*"
matplotlib = "3.8.*"
packaging = "24.*"
pillow = "*"

[pypi-dependencies]
absl-py = "==2.1.0"
einops = "==0.8.0"
ffmpeg-python = "==0.2.0"
hydra-core = "==1.3.2"
hydra-submitit-launcher = "==1.2.0"
joblib = "==1.4.2"
lightning = "==2.4.0"
lpips = "==0.1.4"
mediapy = "==1.2.4"
moviepy = "==1.0.3"
opencv-python = "==4.10.0.84"
submitit = "==1.5.3"
pyrootutils = "==1.0.4"
rich = "==13.8.1"
timm = "==1.0.9"
torchmetrics = "==1.4.2"
transformers = "==4.44.2"
tqdm = "==4.66.5"
webdataset = "==0.2.100"
xformers = "==0.0.22.post7"
gsplat = "==1.5.3"
decord = "==0.6.0"
tensorboard = "==2.18.0"

[tasks]
install = "python -m pip install -e ."
